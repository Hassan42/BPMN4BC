<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Workflow Panel</title>
  <script type="module" src="./execution-panel.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>

<body class="bg-gray-100 h-full">

  <!-- Top-level split container -->
  <div id="splitContainer" class="flex h-full">

    <!-- ── Left: Workflow pane ── -->
    <div id="workflowPane" class="flex-1 overflow-y-auto flex justify-center items-start p-6 transition-all duration-300">
      <div class="max-w-4xl w-full bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-1">Blockchain Workflow Panel</h1>
        <p id="instanceNameDisplay" class="hidden text-gray-500 text-sm mb-4"></p>

        <!-- Back to Modeler button — shown on instances list -->
        <div id="backToModelerSection" class="hidden mb-4">
          <button id="back-to-modeler-btn"
            class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50">
            ← Back to Modeler
          </button>
        </div>

        <!-- Back to Instances + View Model buttons — shown when viewing a specific instance -->
        <div id="instanceNavSection" class="hidden flex gap-2 mb-4 flex-wrap items-start">
          <button id="back-to-instances-btn"
            class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50">
            ← All Instances
          </button>
          <button id="view-model-btn"
            class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50">
            View BPMN Model
          </button>

          <!-- Web3 Tools button + dropdown -->
          <div class="relative" id="web3-tools-wrapper">
            <button id="web3-tools-btn"
              class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50">
              Web3 Tools ▾
            </button>

            <div id="web3-tools-dropdown"
              class="hidden absolute left-0 top-full mt-1 z-50 bg-white border border-gray-300 rounded-lg shadow-xl"
              style="min-width: 340px;">

              <div class="px-4 py-3 border-b border-gray-200">
                <span class="font-semibold text-sm text-gray-700">Web3 Tools</span>
              </div>

              <!-- ── Tool: ETH → WEI Converter ── -->
              <div class="px-4 py-3 border-b border-gray-100">
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">
                  ETH → WEI Converter
                </div>
                <div class="flex items-center gap-2 mb-2">
                  <input id="w3t-eth-input" type="number" placeholder="0.0" min="0" step="0.1"
                    class="w-24 px-2 py-1.5 border border-gray-300 rounded text-sm font-mono focus:outline-none focus:border-blue-400" />
                  <span class="text-gray-400 text-sm font-medium">ETH →</span>
                  <div id="w3t-wei-output"
                    class="flex-1 px-2 py-1.5 bg-gray-100 border border-gray-200 rounded text-sm font-mono text-gray-700 overflow-hidden whitespace-nowrap"
                    style="text-overflow: ellipsis; min-width: 0;"
                    title="">—</div>
                </div>
                <div class="flex gap-2 justify-end">
                  <button id="w3t-copy-btn" type="button"
                    class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                    Copy WEI
                  </button>
                </div>
              </div>

              <!-- ── Tool: Random Ethereum Address Generator ── -->
              <div class="px-4 py-3">
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">
                  Random Address Generator
                </div>
                <div class="flex items-center gap-2 mb-2">
                  <div id="w3t-addr-output"
                    class="flex-1 px-2 py-1.5 bg-gray-100 border border-gray-200 rounded text-sm font-mono text-gray-500 overflow-hidden whitespace-nowrap"
                    style="text-overflow: ellipsis; min-width: 0;"
                    title="">0x…</div>
                </div>
                <div class="flex gap-2 justify-end">
                  <button id="w3t-addr-gen-btn" type="button"
                    class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                    Generate
                  </button>
                  <button id="w3t-addr-copy-btn" type="button"
                    class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                    Copy
                  </button>
                </div>
              </div>

            </div><!-- /web3-tools-dropdown -->
          </div><!-- /web3-tools-wrapper -->

        </div>

        <!-- Instances List -->
        <div id="instancesSection" class="mb-4">
          <h2 class="text-lg font-semibold mb-2">Deployed Instances</h2>
          <div id="instancesContainer" class="space-y-1"></div>
        </div>

        <hr class="mb-4" />

        <!-- Spinner -->
        <div id="loading-spinner" class="hidden flex justify-center items-center mb-4">
          <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        </div>

        <!-- Network + sender tab strips -->
        <div id="tabsContainer" class="mb-0"></div>

        <!-- Selected sender's tasks + balances -->
        <div id="jsonContainer" class="border border-t-0 border-gray-300 rounded-b p-4 mb-4"></div>
      </div>
    </div>

    <!-- ── Right: BPMN Viewer pane + Transaction Log (hidden by default) ── -->
    <div id="viewerPane" class="hidden flex-col w-1/2 border-l border-gray-300 bg-white flex-shrink-0">

      <!-- Diagram section (top 60%) -->
      <div class="flex flex-col flex-shrink-0 border-b border-gray-300" style="height:60%">
        <!-- Viewer header -->
        <div class="flex items-center justify-between bg-gray-100 px-4 py-2 border-b border-gray-300 flex-shrink-0">
          <span class="font-semibold text-sm text-gray-700">BPMN Model</span>
          <button id="close-viewer-btn"
            class="px-3 py-1 text-sm rounded border border-gray-300 bg-white hover:bg-gray-50 cursor-pointer">
            ✕ Close
          </button>
        </div>
        <!-- Viewer iframe fills remaining height of this section -->
        <iframe id="viewerFrame" src="" class="flex-1 w-full border-none" style="min-height:0"></iframe>
      </div>

      <!-- Transaction Log section (bottom 40%) -->
      <div id="transactionLogPanel" class="flex flex-col bg-white text-sm" style="height:40%">
        <!-- Log header -->
        <div class="flex items-center justify-between bg-gray-100 px-4 py-2 border-b border-gray-300 flex-shrink-0">
          <span class="font-semibold text-sm text-gray-700">Transaction Log</span>
          <button id="downloadAllLogs" class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap" title="Download All Logs">
            Download Transaction Log
            <!-- <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
            </svg> -->
          </button>
        </div>
        <!-- Scrollable log entries -->
        <div id="logContent" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      </div>

    </div>

  </div>

  <!-- Transaction Popup Modal -->
  <div id="transactionModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full relative">
      <button id="closeModalBtn" class="absolute top-2 right-2 text-gray-500 hover:text-black text-xl">&times;</button>
      <h2 class="text-lg font-bold mb-2">Transaction Details</h2>
      <div id="transactionModalContent" class="text-sm space-y-2 max-h-96 overflow-y-auto"></div>
    </div>
  </div>

</body>

</html>
