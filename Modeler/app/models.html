<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Models – BPMN4BC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./models.js" defer></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto p-6">

    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">BPMN4BC</h1>
        <p class="text-sm text-gray-500">Model blockchain-based processes, compile them to Solidity and run them on a test chain.</p>
      </div>
      <div class="flex flex-wrap gap-2 justify-end">
        <a href="https://github.com/Hassan42/BPMN4BC" target="_blank" rel="noopener"
          class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50"
          title="Source code on GitHub">
          <svg class="h-4 w-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
        <a href="/constructs" class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50"
          title="All BPMN4BC constructs with description and usage">
          Constructs
        </a>
        <a id="back-to-modeler-link" href="#" class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50"
          title="Continue the diagram you were last editing">
          Open Modeler →
        </a>
      </div>
    </div>

    <!-- Loading spinner -->
    <div id="loading-spinner" class="flex justify-center items-center py-16 hidden">
      <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
    </div>

    <!-- Start: create / import / example (always shown) -->
    <div id="start-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10"></div>
    <input type="file" id="import-input" accept=".bpmn,.xml" class="hidden" />

    <h2 class="text-lg font-semibold text-gray-700 mb-4">My Models</h2>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-10 text-gray-500 border border-dashed border-gray-300 rounded-lg">
      <p class="text-sm">No saved models yet. Create or import one, then click <strong>Save Model</strong> in the modeler.</p>
    </div>

    <!-- Models grid -->
    <div id="models-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <!-- Delete confirm modal -->
  <div id="delete-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
      <h2 class="text-lg font-bold mb-2 text-red-600">Delete Model</h2>
      <p id="delete-modal-text" class="text-sm text-gray-600 mb-4"></p>
      <div class="flex justify-end gap-2">
        <button id="delete-modal-cancel"
          class="px-4 py-2 text-sm rounded border border-gray-300 hover:bg-gray-100">Cancel</button>
        <button id="delete-modal-confirm"
          class="px-4 py-2 text-sm rounded bg-red-500 text-white hover:bg-red-600">Delete</button>
      </div>
    </div>
  </div>

</body>

</html>
