<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Process Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Process State Viewer</h1>
        <button onclick="fetchData()" class="mb-4 bg-blue-500 text-white px-4 py-2 rounded">Fetch Data</button>
        <div id="tabsContainer" class="flex space-x-2 mb-4"></div>
        <div id="jsonContainer"></div>
    </div>

    <script>
        let jsonData = {};

        async function fetchData() {
            try {
                const response = await fetch('http://localhost:3000/query');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                jsonData = await response.json();
                renderTabs(jsonData.result);
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function renderTabs(networks) {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            const firstNetwork = Object.keys(networks)[0];
            
            Object.keys(networks).forEach((networkKey, index) => {
                const tabButton = document.createElement('button');
                tabButton.className = `px-4 py-2 rounded bg-gray-300 ${index === 0 ? 'bg-gray-400' : ''}`;
                tabButton.innerText = networkKey;
                tabButton.onclick = () => renderJSON(networks[networkKey], networkKey);
                tabsContainer.appendChild(tabButton);
            });
            
            renderJSON(networks[firstNetwork], firstNetwork);
        }

        function renderJSON(data, networkKey) {
            const container = document.getElementById('jsonContainer');
            container.innerHTML = `<h2 class='text-xl font-bold mb-2'>${networkKey}</h2>`;

            Object.keys(data).forEach(laneKey => {
                const lane = data[laneKey];
                const laneDiv = document.createElement('div');
                laneDiv.className = 'border border-gray-300 p-4 rounded mb-4';
                
                const laneHeader = document.createElement('button');
                laneHeader.className = 'text-lg font-bold bg-gray-200 p-2 rounded w-full text-left';
                laneHeader.innerText = laneKey;
                laneHeader.onclick = () => toggleVisibility(laneContent);
                
                const laneContent = document.createElement('div');
                laneContent.className = 'mt-2';
                
                if (Array.isArray(lane.receiveTasks)) {
                    laneContent.appendChild(createCollapsibleSection('Receive Tasks', lane.receiveTasks));
                }
                if (Array.isArray(lane.localStorage)) {
                    laneContent.appendChild(createCollapsibleSection('Local Storage', lane.localStorage));
                }
                
                laneDiv.appendChild(laneHeader);
                laneDiv.appendChild(laneContent);
                container.appendChild(laneDiv);
            });
        }

        function createCollapsibleSection(title, dataArray) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'mt-2 border border-gray-300 rounded';
            
            const header = document.createElement('button');
            header.className = 'w-full bg-gray-300 p-2 font-semibold text-left';
            header.innerText = title;
            header.onclick = () => toggleVisibility(content);
            
            const content = document.createElement('div');
            content.className = 'p-2 hidden';
            
            dataArray.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-2 bg-gray-100 my-1 rounded';
                itemDiv.innerText = JSON.stringify(item, null, 2);
                content.appendChild(itemDiv);
            });
            
            sectionDiv.appendChild(header);
            sectionDiv.appendChild(content);
            return sectionDiv;
        }

        function toggleVisibility(element) {
            element.classList.toggle('hidden');
        }
    </script>
</body>
</html>
