<!DOCTYPE html>
<html>
<head>
  <title>bpmn-js-example-model-extension</title>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn-embedded.css" />
  <link rel="stylesheet" href="https://unpkg.com/@bpmn-io/properties-panel/dist/assets/properties-panel.css">
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <div id="container"></div>
  <div id="js-properties-panel"></div>

  <!-- Sticky Button Panel -->
  <ul class="buttons fixed bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 bg-white border border-gray-300 p-2 rounded">
    <li>
      <a id="js-download-diagram" href="#" title="Download BPMN diagram"
        class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Download Diagram
      </a>
    </li>
    <!-- <li>
      <a id="js-download-svg" href="#" title="Download as SVG image"
        class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        SVG Image
      </a>
    </li> -->
    <li>
      <a id="js-upload-diagram-btn" title="Upload BPMN diagram"
        class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Upload Diagram
      </a>
      <input type="file" id="js-upload-diagram" accept=".bpmn" class="hidden"/>
    </li>
    <!-- <li>
      <a id="js-compile-diagram" href="#" class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Compile
      </a>
    </li> -->
    <li>
      <a id="js-compile-deploy" href="#" class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Deploy Process
      </a>
    </li>
    <li>
      <a id="js-execute-panel" href="#" class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Workflow Panel
      </a>
    </li>
    <li>
      <a id="js-open-floating-window" href="#" class="px-3 py-1 bg-[#d8d9d9] text-black text-sm rounded border border-[#b1b1b1] cursor-pointer hover:bg-[#c4c5c5]">
        Process Variables
      </a>
    </li>
  </ul>

  <script>
    // Make the Upload button trigger file input
    document.getElementById('js-upload-diagram-btn').addEventListener('click', function() {
      document.getElementById('js-upload-diagram').click();
    });
  </script>

  <script src="app.js"></script>

</body>
</html>
