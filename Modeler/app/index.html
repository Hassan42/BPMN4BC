<!DOCTYPE html>
<html>
<head>
  <title>bpmn-js-example-model-extension</title>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn-embedded.css" />
  <link rel="stylesheet" href="https://unpkg.com/@bpmn-io/properties-panel/dist/assets/properties-panel.css">
  <link rel="stylesheet" href="css/app.css" />
  <style>
    #floating-window {
      position: fixed;
      top: 100px;
      left: 100px;
      width: 300px;
      border: 1px solid #ccc;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
    }

    #floating-window-header {
      background-color: #f1f1f1;
      padding: 10px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #floating-window-content {
      padding: 10px;
    }

    .minimize-btn, .close-btn {
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="js-properties-panel"></div>

  <ul class="buttons">
    <li><a id="js-download-diagram" href title="download BPMN diagram">BPMN diagram</a></li>
    <li><a id="js-download-svg" href title="download as SVG image">SVG image</a></li>
    <li><label for="js-upload-diagram">Upload</label><input type="file" id="js-upload-diagram" title="Upload BPMN diagram" accept=".bpmn"/></li>
    <li><a id="js-compile-diagram" class="active">Compile</a></li>
    <li><a id="js-deploy-diagram" class="active">Deploy</a></li>
    <li><a id="js-execute-panel" class="active">Open Workflow Panel</a></li>
    <li><a id="js-open-floating-window" class="active">Open Floating Window</a></li>
  </ul>

  <div id="floating-window">
    <div id="floating-window-header">
      Example Table
      <div>
        <span class="minimize-btn">_</span>
        <span class="close-btn">X</span>
      </div>
    </div>
    <div id="floating-window-content">
      <table border="1" width="100%">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
        <tr>
          <td>John Doe</td>
          <td>30</td>
          <td>New York</td>
        </tr>
        <tr>
          <td>Jane Smith</td>
          <td>25</td>
          <td>Los Angeles</td>
        </tr>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const floatingWindow = document.getElementById('floating-window');
    const header = document.getElementById('floating-window-header');
    const minimizeBtn = document.querySelector('.minimize-btn');
    const closeBtn = document.querySelector('.close-btn');
    const content = document.getElementById('floating-window-content');
    const openWindowBtn = document.getElementById('js-open-floating-window');

    openWindowBtn.addEventListener('click', () => {
      floatingWindow.style.display = 'block';
    });

    minimizeBtn.addEventListener('click', () => {
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    });

    closeBtn.addEventListener('click', () => {
      floatingWindow.style.display = 'none';
    });

    let isDragging = false;
    let offsetX, offsetY;

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - floatingWindow.offsetLeft;
      offsetY = e.clientY - floatingWindow.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        floatingWindow.style.left = (e.clientX - offsetX) + 'px';
        floatingWindow.style.top = (e.clientY - offsetY) + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
