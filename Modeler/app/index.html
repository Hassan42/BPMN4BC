<!DOCTYPE html>
<html>

<head>
  <title>BPMN4BC</title>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="assets/RECEIVE.svg" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn-embedded.css" />
  <link rel="stylesheet" href="https://unpkg.com/@bpmn-io/properties-panel/dist/assets/properties-panel.css">
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <div id="container"></div>
  <div id="js-properties-panel"></div>

  <!-- Sticky Button Panel -->
  <ul
    class="buttons fixed bottom-4 left-1/2 transform -translate-x-1/2 flex gap-3 bg-white border border-gray-300 p-3 rounded-lg shadow-sm">
    <li>
      <a id="js-download-diagram" href="#" title="Download BPMN diagram"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Download Diagram
      </a>
    </li>
    <li>
      <a id="js-upload-diagram-btn" title="Upload BPMN diagram"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Upload Diagram
      </a>
      <input type="file" id="js-upload-diagram" accept=".bpmn" class="hidden" />
    </li>
    <!-- <li>
      <a id="js-compile-diagram" href="#" class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Compile
      </a>
    </li> -->
    <li>
      <a id="js-compile-deploy" href="#"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Save Model
      </a>
    </li>
    <li>
      <a id="js-my-models" href="#"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        My Models
      </a>
    </li>
    <!-- <li>
      <a id="js-execute-panel" href="#"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Workflow Panel
      </a>
    </li> -->
    <li>
      <a id="js-open-floating-window" href="#"
        class="px-4 py-2 text-sm rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer">
        Process Variables
      </a>
    </li>
  </ul>

  <script>
    // Make the Upload button trigger file input
    document.getElementById('js-upload-diagram-btn').addEventListener('click', function () {
      document.getElementById('js-upload-diagram').click();
    });
  </script>

  <!-- Warning Note -->
  <!-- <div
    class="fixed bottom-16 left-4 bg-white p-2 border border-red-500 text-red-600 italic text-xs rounded shadow-lg w-64">
    Reloading the page will erase the process diagram. Download the diagram to save your work.
  </div> -->

  <!-- Save Model Modal -->
  <div id="deploy-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
      <h2 class="text-lg font-bold mb-3">Save Model</h2>
      <label class="block text-sm text-gray-600 mb-1">Model Name</label>
      <input id="deploy-instance-name" type="text" placeholder="e.g. Loan Process"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="flex justify-end gap-2">
        <button id="deploy-modal-cancel"
          class="px-4 py-2 text-sm rounded border border-gray-300 hover:bg-gray-100">Cancel</button>
        <button id="deploy-modal-confirm"
          class="px-4 py-2 text-sm rounded bg-blue-500 text-white hover:bg-blue-600">Save</button>
      </div>
    </div>
  </div>

  <!-- Deployment Success Modal -->
  <div id="deploy-success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-[420px] flex flex-col">
      <!-- Header -->
      <div class="flex items-center gap-2 px-5 py-4 border-b border-gray-200">
        <h2 class="text-base font-bold text-green-700">Deployment Successful</h2>
      </div>
      <!-- Body -->
      <div class="px-5 py-5 space-y-3">
        <div>
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Instance</span>
          <p class="text-sm font-semibold text-gray-800 mt-0.5" id="deploy-success-name"></p>
        </div>
        <div class="flex gap-6">
          <div>
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Deployment Gas</span>
            <p class="text-sm font-mono text-gray-800 mt-0.5" id="deploy-success-gas"></p>
          </div>
          <div>
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Cost</span>
            <p class="text-sm font-mono text-gray-800 mt-0.5" id="deploy-success-chf"></p>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-100">
        <button id="deploy-success-continue"
          class="px-4 py-2 text-sm rounded border border-gray-300 hover:bg-gray-100">Continue Editing</button>
        <button id="deploy-success-go"
          class="px-4 py-2 text-sm rounded bg-green-600 text-white hover:bg-green-700">Go to Workflow Panel</button>
      </div>
    </div>
  </div>

  <!-- Deployment Error Modal -->
  <div id="deploy-error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-[620px] max-h-[80vh] flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-red-600" id="deploy-error-title">Deployment Failed</h2>
        </div>
        <button id="deploy-error-close" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
      </div>
      <!-- Structured error body -->
      <div id="deploy-error-body" class="flex-1 overflow-auto px-5 py-4 space-y-1"></div>
      <!-- Footer -->
      <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-100">
        <button id="deploy-error-dismiss"
          class="px-4 py-2 text-sm rounded bg-red-500 text-white hover:bg-red-600">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</body>

</html>
