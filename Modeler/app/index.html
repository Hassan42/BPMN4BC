<!DOCTYPE html>
<html>

<head>
  <title>BPMN4BC</title>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="assets/RECEIVE.svg" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css" />
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn-embedded.css" />
  <link rel="stylesheet" href="https://unpkg.com/@bpmn-io/properties-panel/dist/assets/properties-panel.css">
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <div id="container"></div>
  <div id="js-properties-panel"></div>

  <!-- Sticky Button Panel -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 flex flex-col items-center z-50">

    <!-- Main toolbar -->
    <div id="js-toolbar"
      class="flex items-stretch bg-white border border-gray-300 rounded-lg shadow-sm mb-1">

      <!-- Group 1: Diagram file operations -->
      <div class="flex items-center gap-1 px-2 py-2">
        <a id="js-new-diagram" href="#" title="Clear diagram and start fresh"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-red-50 hover:border-red-300 hover:text-red-600 cursor-pointer whitespace-nowrap">
          New
        </a>
        <a id="js-download-diagram" href="#" title="Download BPMN diagram"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Download BPMN
        </a>
        <a id="js-download-svg" href="#" title="Download diagram as SVG"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Download SVG
        </a>
        <a id="js-upload-diagram-btn" title="Upload BPMN diagram"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Upload
        </a>
        <input type="file" id="js-upload-diagram" accept=".bpmn" class="hidden" />
      </div>

      <!-- Divider -->
      <div class="w-px bg-gray-200 my-2"></div>

      <!-- Group 2: Model library -->
      <div class="flex items-center gap-1 px-2 py-2">
        <a id="js-compile-deploy" href="#"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Save Model
        </a>
        <a id="js-my-models" href="#"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          My Models
        </a>
      </div>

      <!-- Divider -->
      <div class="w-px bg-gray-200 my-2"></div>

      <!-- Group 3: Analysis / inspect -->
      <div class="flex items-center gap-1 px-2 py-2">
        <a id="js-open-floating-window" href="#"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Variables
        </a>
        <a id="js-open-tx-boundary-window" href="#"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Tx Boundaries
        </a>
      </div>

      <!-- Divider -->
      <div class="w-px bg-gray-200 my-2"></div>

      <!-- Group 4: View toggles -->
      <div class="flex items-center gap-1 px-2 py-2">
        <a id="js-toggle-properties" href="#"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Hide Properties
        </a>
      </div>

      <!-- Divider -->
      <div class="w-px bg-gray-200 my-2"></div>

      <!-- Group 5: Web3 Tools -->
      <div class="flex items-center px-2 py-2 relative" id="w3t-wrapper">
        <button id="w3t-btn"
          class="px-3 py-1.5 text-xs rounded border border-gray-300 bg-white hover:bg-blue-50 cursor-pointer whitespace-nowrap">
          Web3 Tools ▾
        </button>

        <!-- Dropdown — opens upward -->
        <div id="w3t-dropdown"
          class="hidden absolute left-0 bottom-full mb-1 z-50 bg-white border border-gray-300 rounded-lg shadow-xl"
          style="min-width:340px;">

          <div class="px-4 py-3 border-b border-gray-200">
            <span class="font-semibold text-sm text-gray-700">Web3 Tools</span>
          </div>

          <!-- ETH → WEI Converter -->
          <div class="px-4 py-3 border-b border-gray-100">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">ETH → WEI Converter</div>
            <div class="flex items-center gap-2 mb-2">
              <input id="w3t-eth-input" type="number" placeholder="0.0" min="0" step="any"
                class="w-24 px-2 py-1.5 border border-gray-300 rounded text-sm font-mono focus:outline-none focus:border-blue-400" />
              <span class="text-gray-400 text-sm font-medium">ETH →</span>
              <div id="w3t-wei-output"
                class="flex-1 px-2 py-1.5 bg-gray-100 border border-gray-200 rounded text-sm font-mono text-gray-700 overflow-hidden whitespace-nowrap"
                style="text-overflow:ellipsis;min-width:0;" title="">—</div>
            </div>
            <div class="flex gap-2 justify-end">
              <button id="w3t-copy-btn" type="button"
                class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                Copy WEI
              </button>
            </div>
          </div>

          <!-- Random Address Generator -->
          <div class="px-4 py-3">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Random Address Generator</div>
            <div class="flex items-center gap-2 mb-2">
              <div id="w3t-addr-output"
                class="flex-1 px-2 py-1.5 bg-gray-100 border border-gray-200 rounded text-sm font-mono text-gray-500 overflow-hidden whitespace-nowrap"
                style="text-overflow:ellipsis;min-width:0;" title="">0x…</div>
            </div>
            <div class="flex gap-2 justify-end">
              <button id="w3t-addr-gen-btn" type="button"
                class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                Generate
              </button>
              <button id="w3t-addr-copy-btn" type="button"
                class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 transition-colors">
                Copy
              </button>
            </div>
          </div>

        </div><!-- /w3t-dropdown -->
      </div><!-- /w3t-wrapper -->

    </div>

    <!-- Toggle tab (always visible) -->
    <button id="js-toolbar-toggle"
      class="text-xs text-gray-400 hover:text-gray-700 bg-white border border-gray-300 rounded-b-md px-4 py-0.5 mb-0 leading-tight hover:bg-gray-50 select-none">
      ▼
    </button>

  </div>

  <script>
    // Make the Upload button trigger file input
    document.getElementById('js-upload-diagram-btn').addEventListener('click', function () {
      document.getElementById('js-upload-diagram').click();
    });

    // Toolbar hide / show toggle
    document.getElementById('js-toolbar-toggle').addEventListener('click', function () {
      var toolbar = document.getElementById('js-toolbar');
      var hidden = toolbar.style.display === 'none';
      toolbar.style.display = hidden ? 'flex' : 'none';
      this.textContent = hidden ? '▼' : '▲';
    });

    // Properties panel hide / show toggle
    document.getElementById('js-toggle-properties').addEventListener('click', function () {
      var panel = document.getElementById('js-properties-panel');
      var hidden = panel.style.display === 'none';
      panel.style.display = hidden ? '' : 'none';
      this.textContent = hidden ? 'Hide Properties' : 'Show Properties';
    });

    // ── Web3 Tools ────────────────────────────────────────────────────────────
    (function () {
      var btn      = document.getElementById('w3t-btn');
      var dropdown = document.getElementById('w3t-dropdown');
      var wrapper  = document.getElementById('w3t-wrapper');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });
      document.addEventListener('click', function (e) {
        if (!wrapper.contains(e.target)) dropdown.classList.add('hidden');
      });

      // ETH → WEI converter
      var ethInput  = document.getElementById('w3t-eth-input');
      var weiOutput = document.getElementById('w3t-wei-output');
      var copyBtn   = document.getElementById('w3t-copy-btn');

      function ethToWei(ethStr) {
        var val = parseFloat(ethStr);
        if (isNaN(val) || val < 0) return null;
        var parts = ethStr.replace(',', '.').split('.');
        var intPart = parts[0], fracPart = parts[1] || '';
        var frac18 = (fracPart + '000000000000000000').slice(0, 18);
        try { return (BigInt(intPart) * BigInt('1000000000000000000') + BigInt(frac18)).toString(); }
        catch (_) { return Math.round(val * 1e18).toString(); }
      }

      ethInput.addEventListener('input', function () {
        var wei = ethToWei(ethInput.value);
        if (wei !== null) { weiOutput.textContent = wei + ' wei'; weiOutput.title = wei + ' wei'; }
        else              { weiOutput.textContent = '—'; weiOutput.title = ''; }
      });

      function flash(btn) {
        var orig = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.classList.add('text-green-600', 'border-green-400');
        setTimeout(function () { btn.textContent = orig; btn.classList.remove('text-green-600', 'border-green-400'); }, 1500);
      }

      function copyText(text, btn) {
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          try { document.execCommand('copy'); } catch (_) {}
          ta.remove(); flash(btn);
        }
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(text).then(function () { flash(btn); }).catch(fallback);
        else fallback();
      }

      copyBtn.addEventListener('click', function () {
        var wei = ethToWei(ethInput.value);
        if (wei !== null) copyText(wei, copyBtn);
      });

      // Random address generator
      var addrOutput  = document.getElementById('w3t-addr-output');
      var addrGenBtn  = document.getElementById('w3t-addr-gen-btn');
      var addrCopyBtn = document.getElementById('w3t-addr-copy-btn');
      var lastAddr    = '';

      function genAddress() {
        var bytes = crypto.getRandomValues(new Uint8Array(20));
        return '0x' + Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }

      function setAddr(addr) {
        lastAddr = addr;
        addrOutput.textContent = addr; addrOutput.title = addr;
        addrOutput.classList.replace('text-gray-500', 'text-gray-700');
      }

      setAddr(genAddress());

      addrGenBtn.addEventListener('click',  function () { setAddr(genAddress()); });
      addrCopyBtn.addEventListener('click', function () { if (lastAddr) copyText(lastAddr, addrCopyBtn); });
    })();
  </script>

  <!-- Save Model Modal -->
  <div id="deploy-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
      <h2 class="text-lg font-bold mb-3">Save Model</h2>
      <label class="block text-sm text-gray-600 mb-1">Model Name</label>
      <input id="deploy-instance-name" type="text" placeholder="e.g. Loan Process"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="flex justify-end gap-2">
        <button id="deploy-modal-cancel"
          class="px-4 py-2 text-sm rounded border border-gray-300 hover:bg-gray-100">Cancel</button>
        <button id="deploy-modal-confirm"
          class="px-4 py-2 text-sm rounded bg-blue-500 text-white hover:bg-blue-600">Save</button>
      </div>
    </div>
  </div>

  <!-- Deployment Success Modal -->
  <div id="deploy-success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-[420px] flex flex-col">
      <!-- Header -->
      <div class="flex items-center gap-2 px-5 py-4 border-b border-gray-200">
        <h2 class="text-base font-bold text-green-700">Deployment Successful</h2>
      </div>
      <!-- Body -->
      <div class="px-5 py-5 space-y-3">
        <div>
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Instance</span>
          <p class="text-sm font-semibold text-gray-800 mt-0.5" id="deploy-success-name"></p>
        </div>
        <div class="flex gap-6">
          <div>
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Deployment Gas</span>
            <p class="text-sm font-mono text-gray-800 mt-0.5" id="deploy-success-gas"></p>
          </div>
          <div>
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Cost</span>
            <p class="text-sm font-mono text-gray-800 mt-0.5" id="deploy-success-chf"></p>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-100">
        <button id="deploy-success-continue"
          class="px-4 py-2 text-sm rounded border border-gray-300 hover:bg-gray-100">Continue Editing</button>
        <button id="deploy-success-go"
          class="px-4 py-2 text-sm rounded bg-green-600 text-white hover:bg-green-700">Go to Workflow Panel</button>
      </div>
    </div>
  </div>

  <!-- Deployment Error Modal -->
  <div id="deploy-error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-[620px] max-h-[80vh] flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-red-600" id="deploy-error-title">Deployment Failed</h2>
        </div>
        <button id="deploy-error-close" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
      </div>
      <!-- Structured error body -->
      <div id="deploy-error-body" class="flex-1 overflow-auto px-5 py-4 space-y-1"></div>
      <!-- Footer -->
      <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-100">
        <button id="deploy-error-dismiss"
          class="px-4 py-2 text-sm rounded bg-red-500 text-white hover:bg-red-600">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</body>

</html>
